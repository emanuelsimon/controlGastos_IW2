<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>CtrlGasto - Presupuestos</title>
</head>
<body>
    <div class="cg-app">
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Presupuestos</h1>
            <p class="cg-subtitle">Establezca cuánto quiere gastar por categoría</p>

            <!-- Presupuesto mensual general -->
            <div class="cg-chart-box cg-budget-box">
                <h2>Presupuesto mensual total</h2>
                <div class="cg-field">
                    <label>Límite mensual ($)</label>
                    <input type="number" id="input-presupuesto-total" placeholder="Ej: 150000">
                </div>
                <!-- Meta de ahorro -->
                <div class="cg-field">
                    <label>Meta de ahorro mensual ($)</label>
                    <input type="number" id="input-meta-ahorro" placeholder="Ej: 50000">
                </div>
                <button class="cg-btn" onclick="guardarPresupuestoGeneral()">Guardar</button>
            </div>

            <!-- Presupuestos por categoría -->
            <h2 class="cg-section-title">Establezca el presupuesto mensual por Categoría</h2>
            <div id="budgets-grid" class="cg-budget-grid"></div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/budgets.js"></script>
</body>
</html>
