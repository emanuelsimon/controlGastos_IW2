<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>CtrlGasto - Presupuestos</title>
</head>
<body>
    <div class="cg-app">
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Presupuestos</h1>
            <p class="cg-subtitle">Controlá cuánto querés gastar por categoría</p>

            <!-- Presupuesto mensual general -->
            <div class="cg-chart-box" style="max-width:480px;margin-bottom:1.5rem">
                <h2 style="margin-bottom:1rem">Presupuesto mensual total</h2>
                <div class="cg-field">
                    <label>Límite mensual ($)</label>
                    <input type="number" id="input-presupuesto-total" placeholder="Ej: 150000">
                </div>
                <!-- Punto 5 — Meta de ahorro -->
                <div class="cg-field">
                    <label>Meta de ahorro mensual ($)</label>
                    <input type="number" id="input-meta-ahorro" placeholder="Ej: 50000">
                </div>
                <button class="cg-btn" style="margin-top:0.5rem" onclick="guardarPresupuestoGeneral()">Guardar</button>
            </div>

            <!-- Presupuestos por categoría -->
            <h2 style="font-size:16px;color:#f1f5f9;margin-bottom:1rem">Por categoría</h2>
            <div id="budgets-grid" class="cg-budget-grid"></div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/budgets.js"></script>
</body>
</html>
