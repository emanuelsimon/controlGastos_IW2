<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>CtrlGasto - Registro</title>
</head>

<body>
    <div class="cg-wrap">
        <div class="cg-card">
            <div class="cg-logo">
                <div class="cg-logo-icon">$</div>
                <div class="cg-logo-text">Ctrl<span>Gasto</span></div>
            </div>

            <h1>Crear cuenta</h1>
            <p class="cg-subtitle">Completá tus datos para empezar</p>

            <form id="register-form">
                <div class="cg-row">
                    <div class="cg-field">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" placeholder="Tu nombre">
                    </div>
                    <div class="cg-field">
                        <label for="lastname">Apellido</label>
                        <input type="text" id="lastname" placeholder="Tu apellido">
                    </div>
                </div>

                <div class="cg-row">
                    <div class="cg-field">
                        <label for="dni">DNI</label>
                        <input type="number" id="dni" placeholder="12345678">
                    </div>
                    <div class="cg-field">
                        <label for="rol">Rol</label>
                        <select id="rol">
                            <option value="usuario">Usuario</option>
                            <option value="asesor">Asesor</option>
                        </select>
                    </div>
                </div>

                <div class="cg-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>

                <hr class="cg-divider">

                <div class="cg-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                </div>

                <div class="cg-field">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Repetí tu contraseña">
                </div>

                <button type="submit" class="cg-btn">Crear cuenta</button>
            </form>

            <p class="cg-footer">¿Ya tenés cuenta? <a href="index.html">Iniciá sesión</a></p>
        </div>
    </div>
</body>

</html>
