<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/expenses.css">
    <title>CtrlGasto - Usuarios</title>
</head>
<body>
    <div class="cg-app">
        <aside class="cg-sidebar">
            <div class="cg-logo">
                <div class="cg-logo-icon">$</div>
                <div class="cg-logo-text">Ctrl<span>Gasto</span></div>
            </div>
            <div class="cg-user">
                <div class="cg-user-name" id="user-name">Asesor</div>
            </div>
            <nav class="cg-nav">
                <a href="dashboard.html" class="cg-nav-item">🏠 Panel</a>
                <a href="users.html" class="cg-nav-item">👥 Usuarios</a>
            </nav>
            <button id="logout-btn" class="cg-logout">Cerrar sesión</button>
        </aside>

        <main class="cg-main">
            <h1>Usuarios</h1>
            <p class="cg-subtitle">Listado de usuarios registrados</p>

            <div class="content-box">
                <div class="cg-filters">
                    <button class="cg-filter active">Todos</button>
                    <button class="cg-filter">Por Apellido</button>
                </div>
                <div class="cg-table-wrapper">
                    <table class="cg-table">
                        <thead>
                            <tr>
                                <th>DNI</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/users.js"></script>
</body>
</html>
