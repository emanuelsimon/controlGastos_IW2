<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/upload.css">
    <title>CtrlGasto - Enviar Recomendación</title>
</head>
<body>
    <div class="cg-app">
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Enviar Recomendación</h1>
            <p class="cg-subtitle" id="subtitle">Para: <span id="user-target"></span></p>
            <div class="cg-form-container-wide">
                <div class="cg-chart-box">
                    <form id="recommendation-form">
                        <div class="cg-field">
                            <label>Recomendación <span class="cg-required">*</span></label>
                            <textarea id="mensaje" rows="5" class="cg-textarea" placeholder="Escribí tu recomendación financiera..."></textarea>
                        </div>
                        <button class="cg-btn" type="submit">Enviar recomendación</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/send-recommendation.js"></script>
</body>
</html>
