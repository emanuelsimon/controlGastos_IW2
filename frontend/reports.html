<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reports.css">
    <title>CtrlGasto - Reportes</title>
</head>
<body>
    <div class="cg-app">
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Reportes</h1>
            <p class="cg-subtitle">Visualizá tu historial de gastos</p>

            <!-- Comparación de meses -->
            <div class="cg-chart-box cg-chart-box-bottom">
                <h2>Comparación mes actual vs anterior (solo aquellos que contienen gastos ingresados)</h2>
                <div id="comparacion-meses"><p class="cg-loading">Cargando...</p></div>
            </div>

            <div class="content-box">
                <div class="cg-dashboard">

                    <!-- Gráfico 1 -->
                    <div class="cg-chart-box">
                        <h2>Gastos por categoría</h2>
                        <canvas id="grafico-categorias"></canvas>
                    </div>

                    <!-- Gráfico 2 -->
                    <div class="cg-chart-box">
                        <h2>Gastos por mes</h2>
                        <canvas id="grafico-meses"></canvas>
                    </div>

                    <!-- Gráfico 3 -->
                    <div class="cg-chart-box">
                        <h2>Comercios más frecuentes</h2>
                        <canvas id="grafico-comercios"></canvas>
                    </div>

                </div>
            </div>

            <!-- Ranking de comercios -->
            <div class="cg-chart-box cg-chart-box-top">
                <h2>Ranking de comercios</h2>
                <div id="ranking-comercios"><p class="cg-loading">Cargando...</p></div>
            </div>

            <!-- Patrones de consumo -->
            <div class="cg-chart-box cg-chart-box-top">
                <h2>Patrones de consumo</h2>
                <div id="patrones-consumo"><p class="cg-loading">Cargando...</p></div>
            </div>

        </main>
    </div>
    <script src="js/vendor/chart.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
