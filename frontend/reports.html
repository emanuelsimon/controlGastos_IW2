<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reports.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap"
        rel="stylesheet">
    <title>CtrlGasto - Reportes</title>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <main class="cg-main">
            <h1>Reportes</h1>
            <p class="cg-subtitle">Visualiza tu historial de gastos</p>

            <div class="content-box">

                <div class="cg-dashboard">
                    <div class="cg-chart-box">
                        <h2>Gastos por Categoría</h2>
                        <canvas id="grafico-categorias"></canvas>
                    </div>

                    <div class="cg-chart-box">
                        <h2>Gastos por Mes</h2>
                        <canvas id="grafico-meses"></canvas>
                    </div>

                    <div class="cg-chart-box">
                        <h2>Comercios más frecuentes</h2>
                        <canvas id="grafico-comercios"></canvas>
                    </div>
                </div>
            </div>
        </main>
</body>

<script src="js/vendor/chart.min.js"></script>
<script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/reports.js"></script>

</html>
