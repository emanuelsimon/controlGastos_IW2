<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reports.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap"
        rel="stylesheet">
    <title>CtrlGasto - Reportes</title>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <aside class="cg-sidebar">
            <div class="cg-logo">
                <div class="cg-logo-icon">$</div>
                <div class="cg-logo-text">Ctrl<span>Gasto</span></div>
            </div>

            <!-- Nombre del Usuario -->
            <div class="cg-user">
                <div class="cg-user-name" id="user-name">Usuario</div>
            </div>

            <nav class="cg-nav">
                <a href="dashboard.html" class="cg-nav-item">🏠 Dashboard</a>
                <a href="expenses.html" class="cg-nav-item">📊 Gastos</a>
                <a href="upload.html" class="cg-nav-item">📤 Subir</a>
                <a href="reports.html" class="cg-nav-item">📈 Reportes</a>
                <a href="recommendations.html" class="cg-nav-item">💡 Recomendaciones</a>
                <a href="profile.html" class="cg-nav-item">👤 Mi Perfil</a>
            </nav>

            <button id="logout-btn" class="cg-logout">Cerrar sesión</button>
        </aside>

        <main class="cg-main">
            <h1>Reportes</h1>
            <p class="cg-subtitle">Visualiza tu historial de gastos</p>

            <div class="content-box">

                <div class="cg-dashboard">
                    <div class="cg-chart-box">
                        <h2>Gastos por Categoría</h2>
                        <canvas id="grafico-categorias"></canvas>
                    </div>

                    <div class="cg-chart-box">
                        <h2>Gastos por Mes</h2>
                        <canvas id="grafico-meses"></canvas>
                    </div>

                    <div class="cg-chart-box">
                        <h2>Comercios más frecuentes</h2>
                        <canvas id="grafico-comercios"></canvas>
                    </div>
                </div>
            </div>
        </main>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/reports.js"></script>

</html>
