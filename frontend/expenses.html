<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/expenses.css">
    <title>CtrlGasto - Gastos</title>
</head>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <aside class="cg-sidebar">
            <div class="cg-logo">
                <div class="cg-logo-icon">$</div>
                <div class="cg-logo-text">Ctrl<span>Gasto</span></div>
            </div>

            <!-- Nombre del Usuario -->
            <div class="cg-user">
                <div class="cg-user-name" id="user-name">Usuario</div>
            </div>

            <nav class="cg-nav">
                <a href="dashboard.html" class="cg-nav-item">🏠 Dashboard</a>
                <a href="expenses.html" class="cg-nav-item">📊 Gastos</a>
                <a href="upload.html" class="cg-nav-item">📤 Subir</a>
                <a href="reports.html" class="cg-nav-item">📈 Reportes</a>
                <a href="recommendations.html" class="cg-nav-item">💡 Recomendaciones</a>
            </nav>

            <button id="logout-btn" class="cg-logout">Cerrar sesión</button>
        </aside>

        <main class="cg-main">
            <h1>Gastos</h1>
            <p class="cg-subtitle">Historial de movimientos</p>

            <div class="content-box">

                <!-- Filtros -->
                <div class="cg-filters">
                    <button class="cg-filter active">Todos</button>
                    <button class="cg-filter">Por mes</button>
                    <button class="cg-filter">Categoría</button>
                    <button class="cg-filter">Comercio</button>
                </div>

                <!-- Tabla -->
                <div class="cg-table-wrapper">
                    
                    <table class="cg-table">
                        <thead>
                            <tr>
                                <th>Comercio</th>
                                <th>Categoría</th>
                                <th>Fecha</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body"></tbody>
                    </table>
                </div>
                
            </div>
            <div class="cg-pagination" id="pagination"></div>
        </main>
        <script src="js/utils.js"></script>
        <script src="js/api.js"></script>
        <script src="js/expenses.js"></script>
</body>

</html>
