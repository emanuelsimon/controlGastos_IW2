<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/expenses.css">
    <title>CtrlGasto - Gastos</title>
</head>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <main class="cg-main">
            <h1>Gastos</h1>
            <p class="cg-subtitle">Historial de movimientos</p>

            <div class="content-box">

                <!-- Filtros -->
                <div class="cg-filters">
                    <button class="cg-filter active">Todos</button>
                    <button class="cg-filter">Por mes</button>
                    <button class="cg-filter">Categoría</button>
                    <button class="cg-filter">Comercio</button>
                </div>

                <!-- Tabla -->
                <div class="cg-table-wrapper">
                    
                    <table class="cg-table">
                        <thead>
                            <tr>
                                <th>Comercio</th>
                                <th>Categoría</th>
                                <th>Fecha</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body"></tbody>
                    </table>
                </div>
                
            </div>
            <div class="cg-pagination" id="pagination"></div>
        </main>
        <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
        <script src="js/api.js"></script>
        <script src="js/expenses.js"></script>
</body>

</html>
