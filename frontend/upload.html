<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/upload.css">
    <title>CtrlGasto - Subir Gastos</title>
</head>

<body>
    <header>
        <div class="cg-logo">
            <div class="cg-logo-icon">$</div>
            <div class="cg-logo-text">Ctrl<span>Gasto</span></div>
        </div>

        <button id="inicio-btn">← Volver</button>
    </header>

    <main class="cg-wrap" style="align-items:flex-start; padding-top:3rem">
        <div class="cg-card cg-card-wide">
            <h1>Subir gasto</h1>
            <p class="cg-subtitle">Cargá un gasto manualmente o desde un ticket</p>

            <div class="cg-dashboard">

                <!-- UPLOAD -->
                <div class="cg-chart-box">
                    <h2>Ticket</h2>

                    <div class="cg-upload-box">
                        <p>📷 Subí una imagen</p>
                        <input type="file" id="ticket-image" accept="image/*">
                        <button class="cg-btn" id="procesar-btn">Procesar con IA</button>
                    </div>
                </div>

                <!-- FORM -->
                <div class="cg-chart-box">
                    <h2>Datos del gasto</h2>

                    <form id="expense-form">
                        <div class="cg-field">
                            <label>Fecha</label>
                            <input type="date" id="fecha">
                        </div>

                        <div class="cg-field">
                            <label>Categoría</label>
                            <input type="text" id="categoria">
                        </div>

                        <div class="cg-field">
                            <label>Comercio</label>
                            <input type="text" id="comercio">
                        </div>

                        <div class="cg-field">
                            <label>Monto</label>
                            <input type="number" id="monto">
                        </div>

                        <div class="cg-field">
                            <label>Descripción</label>
                            <input type="text" id="descripcion">
                        </div>

                        <button class="cg-btn" type="submit">Guardar gasto</button>
                    </form>
                </div>

            </div>
        </div>
    </main>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/upload.js"></script>
</body>

</html>
