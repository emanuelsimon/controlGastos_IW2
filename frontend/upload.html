<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/upload.css">
    <title>CtrlGasto - Subir Gastos</title>
</head>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <main class="cg-main">
            <h1>Subir gasto</h1>
            <p class="cg-subtitle">Cargá tus gastos fácilmente</p>

            <div class="upload-layout">

                <!-- COLUMNA IZQUIERDA: Dropzone -->
                <div class="upload-left">
                    <div class="cg-dropzone" id="dropzone">
                        <div class="drop-icon">📷</div>
                        <p class="drop-title">Arrastrá tu ticket acá</p>
                        <p class="cg-drop-sub">o hacé click para buscar una imagen</p>
                        <input type="file" id="ticket-image" accept="image/*" hidden>
                    </div>
                    <img id="preview-img"
                        style="display:none; width:100%; margin-top:1rem; border-radius:12px; border: 0.5px solid #2e3a52">
                    <button class="cg-btn" id="procesar-btn">✨ Procesar con IA</button>

                    <!-- Carga múltiple -->
                    <div class="cg-multi-section">
                        <h3 class="cg-section-subtitle">📂 Carga múltiple de tickets</h3>
                        <p class="cg-section-desc">Seleccioná varias imágenes para
                            procesarlas automáticamente.</p>
                        <input type="file" id="multi-ticket-input" accept="image/*" multiple hidden>
                        <label for="multi-ticket-input" class="cg-multi-file-label">📂 Elegir archivos</label>
                        <div id="multi-queue" class="cg-multi-queue"></div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA: Formulario -->
                <div class="upload-right">
                    <!-- Para lograr que un div quede a la derecha del otro se usa 
                     flexbox para crear una disposición de dos columnas. -->
                    <div class="cg-chart-box">
                        <h2>Datos del gasto</h2>
                        <form id="expense-form">
                            <div class="cg-row">
                                <div class="cg-field">
                                    <label>Fecha <span class="cg-required">*</span></label>
                                    <input type="date" id="fecha">
                                </div>
                                <div class="cg-field">
                                    <label>Monto <span class="cg-required">*</span></label>
                                    <input type="text" id="monto" placeholder="$0.00">
                                </div>
                            </div>
                            <div class="cg-field">
                                <label>Comercio <span class="cg-required">*</span></label>
                                <input type="text" id="comercio" placeholder="Nombre del comercio">
                            </div>
                            <div class="cg-field">
                                <label>Categoría <span class="cg-required">*</span></label>
                                <select id="categoria">
                                    <option value="">-- Seleccioná una categoría --</option>
                                    <option value="Alimentación">Alimentación</option>
                                    <option value="Combustible">Combustible</option>
                                    <option value="Salud">Salud</option>
                                    <option value="Ocio">Ocio</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Educación">Educación</option>
                                    <option value="Hogar">Hogar</option>
                                    <option value="Ropa">Ropa</option>
                                    <option value="Servicios">Servicios</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                            <div class="cg-field">
                                <label>Descripción</label>
                                <input type="text" id="descripcion" placeholder="Nota opcional">
                            </div>
                            <button class="cg-btn" type="submit">Guardar gasto</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
        <script src="js/config.js"></script>
        <script src="js/components.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/api.js"></script>
        <script src="js/upload.js"></script>
</body>

</html>
