<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap"
        rel="stylesheet">
    <title>CtrlGasto - Dashboard</title>
</head>

<body>
    <div class="cg-app">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Panel principal</h1>
            <p class="cg-subtitle">¿Qué querés hacer hoy?</p>

            <div class="cards-container">
                <div class="card-option" onclick="window.location.href='expenses.html'">
                    <span class="card-icon">📊</span>
                    <h2>Ver Gastos</h2>
                </div>
                <div class="card-option" onclick="window.location.href='upload.html'">
                    <span class="card-icon">📤</span>
                    <h2>Subir Gastos</h2>
                </div>
                <div class="card-option" onclick="window.location.href='reports.html'">
                    <span class="card-icon">📈</span>
                    <h2>Reportes</h2>
                </div>
                <div class="card-option" onclick="window.location.href='budgets.html'">
                    <span class="card-icon">💰</span>
                    <h2>Presupuestos</h2>
                </div>
            </div>

            <!-- Perfil financiero -->
            <div id="perfil-financiero" class="cg-dashboard-section"></div>

            <!-- Meta de ahorro -->
            <div id="meta-ahorro"></div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
