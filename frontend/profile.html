<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>CtrlGasto - Mi Perfil</title>
</head>
<body>
    <div class="cg-app">
        <div id="sidebar-container"></div>
        <main class="cg-main">
            <h1>Mi Perfil</h1>
            <p class="cg-subtitle">Editá tus datos personales</p>
            <div style="max-width:500px">
                <div class="cg-chart-box">
                    <form id="profile-form">
                        <div class="cg-row">
                            <div class="cg-field">
                                <label>Nombre</label>
                                <input type="text" id="nombre">
                            </div>
                            <div class="cg-field">
                                <label>Apellido</label>
                                <input type="text" id="apellido">
                            </div>
                        </div>
                        <div class="cg-field">
                            <label>Email</label>
                            <input type="email" id="email">
                        </div>
                        <div class="cg-field">
                            <label>Nueva contraseña <span style="color:#64748b; font-size:11px">(opcional)</span></label>
                            <input type="password" id="password" placeholder="Dejá vacío para no cambiar">
                        </div>
                        <button class="cg-btn" type="submit">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
